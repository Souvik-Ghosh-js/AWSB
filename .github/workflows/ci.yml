name: CI

# Runs on every push and every pull request. This is the gate: the deploy
# workflow will not run unless this one is green.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first — no point finishing a run
# for a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is what package.json's engines field requires (razorpay@2.9.5
        # needs >=22.2) and what the Lightsail box runs. 24 is the next LTS —
        # it is here to catch a break before an upgrade forces one, so it is
        # allowed to fail the matrix without blocking, see continue-on-error.
        node: ['22']
        include:
          - node: '24'
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci`, never `npm install`: it installs exactly the lockfile and
      # fails if package.json and package-lock.json have drifted, which is the
      # behaviour you want in CI.
      - name: Install dependencies
        run: npm ci

      # NOTE: `node --test tests/` (directory form), not `tests/*.test.js`.
      # The glob form in package.json relies on the SHELL expanding it, which
      # works on the Linux runner but silently fails on Windows with
      # "Could not find tests\*.test.js" — so a developer on Windows cannot run
      # the suite the same way CI does. The directory form works everywhere.
      - name: Run tests
        run: node --test tests/

      # Every test file is deliberately pure — no database, no network, no
      # environment (see the header comments in tests/*.test.js). If that ever
      # stops being true, this step starts failing and the design has drifted,
      # which is worth knowing about immediately.
      - name: Verify the suite still needs no database
        run: node --test tests/
        env:
          # Deliberately empty. A test that has started reaching for the DB
          # will fail here, because config/env.js exits when these are absent.
          DB_HOST: ''
          DB_USER: ''
          DB_NAME: ''

  verify:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches a syntax error in any shipped file before it reaches the box.
      # The API has no build step, so nothing else would catch it until the
      # module is first imported at runtime — i.e. after deploy.
      - name: Syntax-check every source file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find src -name '*.js')
          exit "$fail"

      # The deploy scripts run as bash on Ubuntu. A syntax error in one of them
      # is only discovered mid-deploy otherwise, which is the worst time.
      - name: Syntax-check the deploy scripts
        run: |
          set -euo pipefail
          for f in deploy/*.sh; do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; exit 1; }
          done
          node --check deploy/ecosystem.config.cjs

      # CRLF line endings make bash fail with "$'\r': command not found" and
      # silently disable `set -e`. .gitattributes forces LF for these files;
      # this verifies the rule actually held rather than trusting it.
      - name: Check shell scripts have LF line endings
        run: |
          set -euo pipefail
          bad=0
          for f in deploy/*.sh deploy/cron/awsb-crontab deploy/nginx/*.template; do
            [ -f "$f" ] || continue
            if grep -qU $'\r' "$f"; then
              echo "CRLF line endings in $f — this will break on the server"
              bad=1
            fi
          done
          exit "$bad"

      # The app boots by importing every router. A bad import path or a missing
      # export would 404 a whole section of the panel at runtime while the
      # process still reports healthy — exactly the failure that took the admin
      # login offline. This catches it in CI instead.
      - name: Verify every router imports and mounts
        run: node scripts/ci/check-routes.mjs
